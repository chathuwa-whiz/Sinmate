[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sinmate"
version = "0.1.0"
description = "Native Sinhala Companion AI - Edge-deployable real-time voice, emotion, and memory companion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sinmate Team" }
]
keywords = ["sinhala", "voice-companion", "llm", "vad", "tts", "stt", "edge-ai"]
dependencies = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "transformers>=4.40.0",
    "sentencepiece>=0.2.0",
    "tokenizers>=0.19.0",
    "tabulate>=0.9.0",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sinmate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
